<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111111" />
  <title>GymBaddies</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="screen-users">
    <div class="logo">GymBaddies 💪</div>
    <h2>Trainingsplan</h2>
    <p>Wer trainiert heute?<br />Wähle ein Profil oder leg ein neues an.</p>
    <div class="user-list" id="user-list"></div>
    <div class="add-user-row">
      <input id="new-user-inp" type="text" placeholder="Neuer Name" autocomplete="off" />
      <button id="add-user-btn" type="button" aria-label="Benutzer anlegen">+</button>
    </div>
    <div class="start-hint">Button wird rot, sobald ein Name eingetragen ist.</div>
  </div>

  <div id="screen-app">
    <header id="header">
      <div class="h-top">
        <div class="h-title">GymBaddies 💪</div>
        <div class="h-actions">
          <button id="top-plans" type="button" class="top-chip"><span>🛠️</span><span>Pläne</span></button>
          <button id="top-settings" type="button" class="top-icon" aria-label="Einstellungen">⚙️</button>
          <button class="h-user" id="user-switch" type="button" aria-label="Profil wechseln">
            <span class="h-avatar" id="h-avatar"></span>
            <span class="h-name" id="h-name"></span>
          </button>
        </div>
      </div>
      <div class="seg">
        <button class="seg-btn active" id="tab-train" type="button">🏋️ Training</button>
        <button class="seg-btn" id="tab-progress" type="button">📈 Fortschritt</button>
      </div>
      <div class="split-tabs" id="split-tabs"></div>
      <div class="daytabs" id="daytabs"></div>
    </header>

    <main class="tcontent screen active" id="train-content"></main>
    <main class="pcontent screen" id="prog-content"></main>
    <main class="pcontent screen" id="plan-content"></main>
    <main class="pcontent screen" id="settings-content"></main>

    <div id="finish-bar"><div id="finish-bar-inner"></div></div>
    <div id="rest-float" class="rest-float">
      <div>
        <div class="rest-label">Pause läuft</div>
        <div class="rest-time" id="rest-time">01:30</div>
      </div>
      <button class="rest-close" type="button" id="rest-close">×</button>
    </div>
    <div id="app-toast" class="toast"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

<div class="bottom-nav">
  <button>Home</button>
  <button>Workout</button>
  <button>Progress</button>
  <button>Plans</button>
  <button>Settings</button>
</div>


<!-- ===== NEW APP SHELL ===== -->
<link rel="stylesheet" href="css/mobile-refactor.css">

<div class="app-header">
  <h1>GymBaddies</h1>
</div>

<section class="dashboard-grid">
  <div class="dashboard-card">
    <strong>Workout Streak</strong>
    <p>7 Tage 🔥</p>
  </div>

  <div class="dashboard-card">
    <strong>Letzter PR</strong>
    <p>Bench Press +5kg</p>
  </div>
</section>

<section class="workout-focus">
  <div class="exercise-card">
    <h3>Heutiges Workout</h3>
    <p>Push Day • 6 Übungen</p>
    <button class="primary-btn">Workout starten</button>
  </div>
</section>

<button class="fab">+</button>

<nav class="bottom-nav">
  <button>Home</button>
  <button>Workout</button>
  <button>Progress</button>
  <button>Plans</button>
  <button>Settings</button>
</nav>

</body>
</html>
