<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="transparent" />
  <title>GymBaddies</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="vendor/chart-lite.js"></script>
</head>
<body>

  <!-- ── User Select ───────────────────────────────────────────────────── -->
  <div id="screen-users">
    <div class="logo">GymBaddies 💪</div>
    <h2>Wer trainiert heute?</h2>
    <div class="user-list" id="user-list"></div>
    <div class="add-user-row">
      <input id="new-user-inp" type="text" placeholder="Neuer Name" autocomplete="off" />
      <button id="add-user-btn" type="button" aria-label="Benutzer anlegen">+</button>
    </div>
    <div class="start-hint">Button wird rot sobald ein Name eingetragen ist.</div>
  </div>

  <!-- ── App ───────────────────────────────────────────────────────────── -->
  <div id="screen-app">
    <header id="header">
      <div class="h-top">
        <div class="h-title">GymBaddies 💪</div>
        <div class="h-actions">
          <button class="h-user" id="top-profile-menu" type="button" aria-label="Profil">
            <span class="h-avatar" id="h-avatar"></span>
            <span class="h-name"   id="h-name"></span>
            <span class="menu-dot">⌄</span>
          </button>
        </div>
      </div>

      <!-- Compact fallback tabs; bottom navigation is the primary mobile nav -->
      <div class="seg" aria-label="Schnellnavigation">
        <button class="seg-btn active" id="tab-home"  type="button">Home</button>
        <button class="seg-btn"        id="tab-train" type="button">Training</button>
      </div>

      <!-- Plan tabs (only shown in training) -->
      <div class="split-tabs" id="split-tabs" style="display:none"></div>
      <div class="daytabs"    id="daytabs"    style="display:none"></div>
    </header>

    <!-- Screens -->
    <main class="pcontent screen active" id="home-content"></main>
    <main class="tcontent screen"        id="train-content"></main>
    <main class="pcontent screen"        id="prog-content"></main>
    <main class="pcontent screen"        id="plan-content"></main>
    <main class="pcontent screen"        id="settings-content"></main>

    <!-- Finish bar (training only) -->
    <div id="finish-bar" style="display:none">
      <div id="finish-bar-inner"></div>
    </div>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Hauptnavigation">
      <button class="bottom-nav-btn active" id="bn-home" type="button" data-screen="home" data-bottom-nav="home"><span class="bn-ico"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="bn-label">Home</span></button>
      <button class="bottom-nav-btn" id="bn-train" type="button" data-screen="train" data-bottom-nav="train"><span class="bn-ico"><svg viewBox="0 0 24 24"><path d="M4 10v4m16-4v4M7 8v8m10-8v8M7 12h10"/></svg></span><span class="bn-label">Training</span></button>
      <button class="bottom-nav-btn" id="bn-progress" type="button" data-screen="progress" data-bottom-nav="progress"><span class="bn-ico"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 16l3-4 3 2 4-7"/></svg></span><span class="bn-label">Fortschritt</span></button>
      <button class="bottom-nav-btn" id="bn-plans" type="button" data-screen="plans" data-bottom-nav="plans"><span class="bn-ico"><svg viewBox="0 0 24 24"><path d="M6 5h12M6 12h12M6 19h8"/></svg></span><span class="bn-label">Pläne</span></button>
    </nav>

    <!-- Rest timer float -->
    <div id="rest-float" class="rest-float">
      <div>
        <div class="rest-label">Pause</div>
        <div class="rest-time" id="rest-time">01:30</div>
      </div>
      <div class="rest-actions">
        <button class="rest-pause" type="button" id="rest-pause">Pause</button>
        <button class="rest-close" type="button" id="rest-close">×</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="app-toast" class="toast"></div>

    <!-- Account menu -->
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div id="account-menu" class="account-menu">
      <div id="menu-connection" class="menu-status"><span class="menu-status-dot"></span><span id="menu-connection-text">Online</span></div>
      <button type="button" id="menu-today">Heute weitertrainieren</button>
      <button type="button" id="menu-settings">Einstellungen</button>
      <button type="button" id="menu-export">Backup exportieren</button>
      <button type="button" id="menu-profile-switch">Profil wechseln</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="vendor/supabase-lite.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
